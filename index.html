<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐBP's Chess - Hồ Sơ Của Tôi</title>
    
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tải FontAwesome cho các icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tải Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .floating-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
        }

        .chess-piece {
            position: absolute; bottom: -20%;
            color: rgba(71, 85, 105, 0.08);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        .piece-1 { left: 10%; font-size: 8rem; animation-duration: 25s; animation-delay: 0s; }
        .piece-2 { left: 30%; font-size: 5rem; animation-duration: 20s; animation-delay: 5s; }
        .piece-3 { left: 70%; font-size: 10rem; animation-duration: 28s; animation-delay: 2s; }
        .piece-4 { left: 85%; font-size: 6rem; animation-duration: 22s; animation-delay: 8s; }
        .piece-5 { left: 50%; font-size: 7rem; animation-duration: 30s; animation-delay: 12s; }
        .piece-6 { left: 20%; font-size: 9rem; animation-duration: 26s; animation-delay: 15s; }

        .fade-in-up {
            opacity: 0; transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .fade-out { animation: fadeOut 0.5s ease-out forwards; }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; display: none; } }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px 0 rgba(31, 38, 135, 0.07);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-shine {
            position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .btn-shine::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.3); transform: skewX(-20deg);
            transition: all 0.5s ease; opacity: 0;
        }
        .btn-shine:hover::after { left: 120%; opacity: 1; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-slate-800 selection:text-white">

    <div class="floating-bg">
        <i class="fa-solid fa-chess-knight chess-piece piece-1"></i>
        <i class="fa-solid fa-chess-pawn chess-piece piece-2"></i>
        <i class="fa-solid fa-chess-king chess-piece piece-3"></i>
        <i class="fa-solid fa-chess-rook chess-piece piece-4"></i>
        <i class="fa-solid fa-chess-queen chess-piece piece-5"></i>
        <i class="fa-solid fa-chess-bishop chess-piece piece-6"></i>
    </div>

    <!-- Thanh Điều Hướng -->
    <nav class="bg-slate-900/95 backdrop-blur-md text-white shadow-lg sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer group fade-in-up">
                    <i class="fa-solid fa-chess-knight text-2xl group-hover:-translate-y-1 transition-transform duration-300 text-blue-400"></i>
                    <span class="font-bold text-xl tracking-wide uppercase bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">ĐBP's Chess</span>
                </div>
                
                <div class="hidden md:flex space-x-8 fade-in-up delay-100">
                    <a href="trangchu.html" class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200 flex items-center gap-2 hover:bg-slate-800">
                        <i class="fa-solid fa-house-chimney"></i> Trang chủ
                    </a>
                    <a href="#" id="navAuthBtn" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-4 py-2 rounded-md text-sm font-bold shadow-lg shadow-emerald-500/30 hover:shadow-emerald-500/50 hover:scale-105 transition-all duration-300 flex items-center gap-2">
                        <i class="fa-solid fa-user-check"></i> Hồ sơ của tôi
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 w-full">
        
        <!-- ================= PHẦN ĐĂNG NHẬP (DỰ PHÒNG NẾU CHƯA ĐĂNG NHẬP) ================= -->
        <div id="loginSection" class="w-full max-w-md glass-card rounded-2xl overflow-hidden hidden fade-in-up">
            <div class="bg-gradient-to-r from-slate-900 to-slate-800 p-8 text-center text-white relative">
                <h2 class="text-3xl font-extrabold tracking-tight mb-2">Chưa Đăng Nhập</h2>
                <p class="text-slate-300 text-sm">Vui lòng đăng nhập để xem hồ sơ</p>
            </div>
            <div class="p-8 text-center">
                <a href="AndroidManifest.html" class="btn-shine inline-block w-full bg-blue-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg">
                    Quay lại trang Đăng Nhập
                </a>
            </div>
        </div>

        <!-- ================= PHẦN DASHBOARD (HỒ SƠ ĐÃ NÂNG CẤP) ================= -->
        <div id="dashboardSection" class="w-full max-w-3xl hidden fade-in-up">
            
            <!-- THẺ HỒ SƠ CÁ NHÂN -->
            <div class="glass-card rounded-3xl p-6 mb-8 flex flex-col sm:flex-row justify-between items-center gap-6 border-l-8 border-blue-500 shadow-xl relative overflow-hidden">
                <!-- Họa tiết trang trí thẻ hồ sơ -->
                <i class="fa-solid fa-chess-board absolute -right-10 -bottom-10 text-[150px] text-slate-200 opacity-40 rotate-12 pointer-events-none"></i>
                
                <div class="flex items-center gap-6 relative z-10 w-full">
                    <!-- Avatar người dùng -->
                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white text-3xl font-bold shadow-lg shadow-blue-500/30 shrink-0 transform hover:rotate-6 transition-transform">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                    
                    <!-- Thông tin: Tên, Lớp, Trường -->
                    <div class="flex-grow">
                        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-1">Kỳ Thủ</h2>
                        <h1 class="text-3xl font-extrabold text-slate-800 mb-3" id="dashName">Tên Người Dùng</h1>
                        
                        <div class="flex flex-wrap gap-3">
                            <span class="bg-white/80 border border-slate-200 px-4 py-1.5 rounded-full text-sm font-bold text-slate-700 shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-graduation-cap text-blue-500"></i>
                                Lớp: <span id="dashClass" class="text-blue-700"></span>
                            </span>
                            <span class="bg-white/80 border border-slate-200 px-4 py-1.5 rounded-full text-sm font-bold text-slate-700 shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-school text-indigo-500"></i>
                                Trường: <span id="dashSchool" class="text-indigo-700"></span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Nút Đăng xuất -->
                <button onclick="logoutUser()" class="relative z-10 btn-shine bg-red-50 text-red-600 border border-red-100 hover:bg-red-500 hover:text-white hover:border-red-500 transition-all duration-300 px-5 py-2.5 rounded-xl font-bold shadow-sm flex items-center gap-2 shrink-0 group">
                    <i class="fa-solid fa-arrow-right-from-bracket group-hover:-translate-x-1 transition-transform"></i> Thoát
                </button>
            </div>

            <!-- THẺ ĐĂNG KÝ GIẢI ĐẤU (SỬ DỤNG ẢNH NỀN KHUVUC.PNG) -->
            <!-- Lớp bọc ngoài tạo viền gradient và shadow -->
            <div class="rounded-3xl p-1.5 shadow-2xl relative overflow-hidden group bg-gradient-to-br from-amber-400 via-orange-500 to-red-600 hover:shadow-orange-500/30 transition-shadow duration-500">
                
                <!-- KHI CHÈN ẢNH: Đã đổi background sang ảnh khuvuc.png -->
                <div class="relative z-10 rounded-2xl overflow-hidden text-center bg-slate-900" 
                     style="background-image: url('khuvuc.png'); background-size: cover; background-position: center; min-height: 300px;">
                    
                    <!-- Lớp phủ tối (Dark Overlay) để đảm bảo chữ trên ảnh luôn đọc được -->
                    <div class="absolute inset-0 bg-black/65 backdrop-blur-[2px] group-hover:bg-black/40 transition-all duration-700"></div>

                    <!-- Nội dung hiển thị bên trên ảnh -->
                    <div class="relative z-20 p-10 flex flex-col items-center justify-center h-full">
                        <i class="fa-solid fa-trophy text-6xl text-amber-400 mb-5 drop-shadow-[0_0_20px_rgba(251,191,36,0.6)] group-hover:scale-110 transition-transform duration-500"></i>
                        
                        <h3 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 uppercase tracking-widest mb-3 drop-shadow-lg">
                            Điện Biên Chess
                        </h3>
                        
                        <p class="text-slate-200 mb-8 font-medium text-lg max-w-lg mx-auto drop-shadow-md">
                            Giải đấu cờ vua lớn nhất khu vực. Ngôi vương đang vẫy gọi, bạn đã sẵn sàng ghi danh?
                        </p>
                        
                        <!-- Vùng nút Đăng ký -->
                        <div id="tournamentActionArea">
                            <!-- Nút sẽ được JS chèn tự động vào đây -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script Xử Lý -->
    <script>
        // Các DOM Elements
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');

        // SĐT được lưu tạm ở localStorage chỉ để biết "đang đăng nhập với ai" trên trình
        // duyệt này — dữ liệu thật (nguồn sự thật) luôn được đọc trực tiếp từ Firestore.
        const currentPhone = localStorage.getItem('dbpChessPhone');

        // Theo dõi 1 kết nối real-time duy nhất tới hồ sơ Firestore của người dùng
        let unsubscribeUser = null;

        // Hàm kiểm tra trạng thái đăng nhập
        function checkAuthStatus() {
            if (!currentPhone) {
                // Chưa đăng nhập -> Hiện bảng yêu cầu quay lại
                loginSection.classList.remove('hidden');
                return;
            }

            // Lắng nghe REAL-TIME hồ sơ người dùng trên Firestore theo SĐT
            unsubscribeUser = db.collection('users').doc(currentPhone)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        showDashboard(doc.data());
                    } else {
                        // Không tìm thấy hồ sơ trên Firestore (VD: đã bị admin xóa)
                        localStorage.removeItem('dbpChessPhone');
                        dashboardSection.classList.add('hidden');
                        loginSection.classList.remove('hidden');
                    }
                }, (error) => {
                    console.error('Lỗi khi lắng nghe Firestore:', error);
                    alert('Không thể kết nối tới máy chủ. Vui lòng kiểm tra mạng và tải lại trang.');
                });
        }

        // Hàm hiển thị Bảng điều khiển (Dashboard) — được gọi lại mỗi khi Firestore có thay đổi
        function showDashboard(user) {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');

            // Gắn thông tin cá nhân vào Thẻ Hồ Sơ
            document.getElementById('dashName').innerText = user.fullName || '';
            document.getElementById('dashClass').innerText = user.className || '';
            document.getElementById('dashSchool').innerText = user.school || '';

            // Kiểm tra trạng thái đã đăng ký giải đấu chưa
            const tourActionArea = document.getElementById('tournamentActionArea');
            if (user.isRegisteredForTournament) {
                // NẾU ĐÃ ĐĂNG KÝ
                tourActionArea.innerHTML = `
                    <div class="inline-flex items-center gap-3 bg-emerald-500/90 backdrop-blur-sm border-2 border-emerald-400 text-white px-8 py-3.5 rounded-full font-extrabold text-lg shadow-[0_0_20px_rgba(16,185,129,0.4)] transform hover:scale-105 transition-all cursor-default">
                        <i class="fa-solid fa-circle-check text-2xl"></i> Bạn đã ghi danh thành công!
                    </div>
                `;
            } else {
                // NẾU CHƯA ĐĂNG KÝ
                tourActionArea.innerHTML = `
                    <button onclick="registerTournament()" class="btn-shine bg-gradient-to-r from-amber-500 to-orange-600 text-white font-extrabold text-lg py-4 px-10 rounded-full shadow-[0_0_20px_rgba(249,115,22,0.5)] hover:scale-105 hover:shadow-[0_0_30px_rgba(249,115,22,0.8)] transition-all duration-300 flex items-center justify-center gap-3 mx-auto">
                        <i class="fa-solid fa-bolt text-xl"></i> ĐĂNG KÝ THI ĐẤU NGAY
                    </button>
                `;
            }
        }

        // Hàm xử lý khi bấm nút "Đăng Ký Thi Đấu Ngay"
        async function registerTournament() {
            if (!currentPhone) return;

            // Đổi nút thành trạng thái Đang Load
            const tourActionArea = document.getElementById('tournamentActionArea');
            tourActionArea.innerHTML = `
                <button class="bg-amber-600/70 backdrop-blur-md text-white font-bold py-4 px-10 rounded-full cursor-not-allowed mx-auto flex items-center gap-3 text-lg">
                    <i class="fa-solid fa-spinner fa-spin text-xl"></i> Đang nộp hồ sơ...
                </button>`;

            try {
                // CẬP NHẬT TRỰC TIẾP LÊN FIRESTORE — onSnapshot ở trên sẽ tự động
                // nhận thay đổi này và vẽ lại giao diện, không cần gọi showDashboard thủ công.
                await db.collection('users').doc(currentPhone).update({
                    isRegisteredForTournament: true
                });
            } catch (error) {
                console.error('Lỗi khi đăng ký giải đấu:', error);
                alert('Đã xảy ra lỗi khi đăng ký. Vui lòng thử lại.\n' + error.message);
                // Khôi phục lại nút bấm nếu lỗi (onSnapshot sẽ tự vẽ lại đúng trạng thái)
            }
        }

        // Hàm Đăng xuất
        function logoutUser() {
            if(confirm('Bạn có chắc chắn muốn thoát khỏi phiên đăng nhập?')) {
                // Hủy lắng nghe real-time trước khi rời trang
                if (unsubscribeUser) unsubscribeUser();
                // Xóa SĐT phiên đăng nhập cục bộ (dữ liệu hồ sơ trên Firestore vẫn còn nguyên)
                localStorage.removeItem('dbpChessPhone');
                // Đẩy người dùng về lại trang đăng nhập (AndroidManifest.html)
                window.location.href = 'AndroidManifest.html';
            }
        }

        // Khởi động kiểm tra khi trang vừa load xong
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
        });

    </script>
</body>
</html>
